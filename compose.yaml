services:
  ecommerce-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: e_commerce_ahmet_kaya
      POSTGRES_PASSWORD: e_commerce_6247

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e_commerce_ahmet_kaya -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
